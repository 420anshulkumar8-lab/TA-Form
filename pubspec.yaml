name: railway_ta_form
description: Railway Travel Allowance Form App (manual entry, no AI).
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # PDF generation & printing
  pdf: ^3.10.8
  printing: ^5.12.0

  # File system & sharing
  path_provider: ^2.1.3
  path: ^1.9.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2

  # UI
  google_fonts: ^6.2.1       # Font - no download needed!
  package_info_plus: ^8.0.2
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Font files hataaye - google_fonts se aa raha hai automatically
